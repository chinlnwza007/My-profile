<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <title>เกี่ยวกับฉัน - กิตติภพ เมฆธนวัฒนะ</title>
    <!-- เชื่อมโยงไฟล์ CSS หลัก -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- กล่องข้อมูลเกี่ยวกับฉัน (Profile Card) -->
    <div class="card">
        <!-- หัวข้อเกี่ยวกับฉัน -->
        <h2>เกี่ยวกับฉัน</h2>
        <p><strong>ชื่อ:</strong> กิตติภพ เมฆธนวัฒนะ</p>
        <p><strong>ชื่อเล่น:</strong> ชิน</p>
        <p><strong>โรงเรียน / มหาวิทยาลัย:</strong> มหาวิทยาลัยนเรศวร</p>
        <p><strong>ข้อความแนะนำตัว:</strong> อายุ 19 ไม่มีไรเป็นของตัวเอง หน้าตาดีไปวันๆ</p>

        <!-- หัวข้อเกี่ยวกับงานอดิเรกของฉัน -->
        <h2>งานอดิเรกของฉัน</h2>
        <!-- รายการงานอดิเรกอย่างน้อย 3 อย่าง -->
        <ul class="hobby-list">
            <li>เล่นเกม</li>
            <li>ร้องเพลง</li>
            <li>ฟังเพลงและพักผ่อน</li>
        </ul>

        <!-- หัวข้อสิ่งที่ฉันชอบ -->
        <h2>สิ่งที่ฉันชอบ</h2>
        <p>เล่นเกม</p>

            <button class="btn">กลับหน้าแรก</button>
        </a>
    </div>

</body>
</html>
